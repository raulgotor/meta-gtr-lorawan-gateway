# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-gtr-lorawan-gateway"
BBFILE_PATTERN_meta-gtr-lorawan-gateway = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-gtr-lorawan-gateway  = "7"

LAYERDEPENDS_meta-gtr-lorawan-gateway = "core"
LAYERSERIES_COMPAT_meta-gtr-lorawan-gateway = "scarthgap"
